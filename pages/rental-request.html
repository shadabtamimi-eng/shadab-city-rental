<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Request Rental | SHADAB CITY RENTAL</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at 15% 10%,rgba(0,190,255,.12),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(0,100,255,.10),transparent 30%),
        #050b12;
}

header{
    height:72px;
    padding:0 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(4,10,18,.95);
    border-bottom:1px solid rgba(0,200,255,.25);
    position:sticky;
    top:0;
    z-index:10;
    backdrop-filter:blur(12px);
}

.logo{
    font-size:21px;
    font-weight:800;
    letter-spacing:1px;
}

.logo span{
    color:#00c8ff;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    text-decoration:none;
    color:#9fb2c3;
    font-size:14px;
}

nav a:hover{
    color:#00c8ff;
}

.container{
    width:92%;
    max-width:1100px;
    margin:55px auto 80px;
}

.title{
    text-align:center;
    margin-bottom:35px;
}

.title h1{
    font-size:44px;
    margin-bottom:12px;
    background:linear-gradient(90deg,#fff,#00c8ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.title p{
    color:#8195a8;
}

.layout{
    display:grid;
    grid-template-columns:1fr 1.2fr;
    gap:25px;
}

.card{
    background:
        linear-gradient(145deg,rgba(13,29,44,.96),rgba(5,13,22,.96));
    border:1px solid rgba(0,200,255,.20);
    border-radius:18px;
    padding:25px;
    box-shadow:0 20px 60px rgba(0,0,0,.30);
}

.equipment-image{
    width:100%;
    height:260px;
    border-radius:12px;
    overflow:hidden;
    background:#07121d;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:20px;
}

.equipment-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.no-image{
    font-size:65px;
    color:#3d566a;
}

.badge{
    display:inline-block;
    padding:6px 11px;
    border-radius:20px;
    background:rgba(0,200,255,.10);
    color:#00c8ff;
    font-size:11px;
    font-weight:bold;
    margin-bottom:12px;
}

.equipment-name{
    font-size:27px;
    margin-bottom:12px;
}

.info{
    color:#8da1b3;
    font-size:14px;
    line-height:1.9;
}

.price{
    color:#00c8ff;
    font-size:25px;
    font-weight:800;
    margin-top:15px;
}

.price span{
    color:#75899a;
    font-size:12px;
    font-weight:normal;
}

.form-title{
    font-size:23px;
    margin-bottom:22px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    color:#b9c9d7;
    font-size:13px;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    background:#07111c;
    color:#fff;
    border:1px solid #203548;
    border-radius:9px;
    padding:13px 14px;
    outline:none;
    font-size:14px;
}

input:focus,
textarea:focus{
    border-color:#00c8ff;
    box-shadow:0 0 0 2px rgba(0,200,255,.08);
}

textarea{
    min-height:100px;
    resize:vertical;
}

.date-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.submit-btn{
    width:100%;
    margin-top:5px;
    padding:15px;
    border:none;
    border-radius:9px;
    background:linear-gradient(135deg,#00c8ff,#0077ff);
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.submit-btn:hover{
    box-shadow:0 10px 30px rgba(0,170,255,.25);
    transform:translateY(-2px);
}

.submit-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

.message{
    display:none;
    padding:13px;
    border-radius:8px;
    margin-bottom:17px;
    font-size:13px;
}

.error{
    background:rgba(255,60,60,.10);
    border:1px solid rgba(255,60,60,.30);
    color:#ff8c8c;
}

.loading{
    text-align:center;
    color:#00c8ff;
    padding:40px 10px;
}

footer{
    border-top:1px solid rgba(0,200,255,.12);
    text-align:center;
    padding:25px;
    color:#566b7c;
    font-size:12px;
}

@media(max-width:800px){

    nav{
        display:none;
    }

    .layout{
        grid-template-columns:1fr;
    }

    .title h1{
        font-size:34px;
    }
}

@media(max-width:500px){

    .date-grid{
        grid-template-columns:1fr;
    }

    .container{
        width:94%;
        margin-top:35px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        SHADAB <span>CITY RENTAL</span>
    </div>

    <nav>
        <a href="../index.html">Home</a>
        <a href="equipment.html">Find Equipment</a>
        <a href="list-equipment.html">List Equipment</a>
        <a href="customer-requests.html">Track Request</a>
    </nav>

</header>


<div class="container">

    <div class="title">
        <h1>Request Rental</h1>
        <p>Send your equipment rental requirement to SHADAB CITY RENTAL.</p>
    </div>


    <div class="layout">

        <!-- EQUIPMENT DETAILS -->

        <div class="card">

            <div id="equipmentLoading" class="loading">
                Loading equipment...
            </div>

            <div id="equipmentDetails" style="display:none;">

                <div class="equipment-image" id="equipmentImage"></div>

                <div class="badge" id="equipmentCategory">
                    EQUIPMENT
                </div>

                <h2 class="equipment-name" id="equipmentName">
                    Equipment
                </h2>

                <div class="info">
                    📍 <span id="equipmentLocation"></span>
                    <br>
                    🆔 <span id="equipmentId"></span>
                </div>

                <div class="price">
                    SAR <span id="equipmentPrice"></span>
                    <span>/ day</span>
                </div>

            </div>

        </div>


        <!-- RENTAL FORM -->

        <div class="card">

            <h2 class="form-title">
                Rental Requirement
            </h2>

            <div id="errorMessage" class="message error"></div>


            <form id="rentalForm">

                <div class="form-group">
                    <label>Full Name *</label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Mobile / WhatsApp *</label>

                    <input
                        type="tel"
                        id="customerPhone"
                        placeholder="+966 5XXXXXXXX"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Company Name</label>

                    <input
                        type="text"
                        id="companyName"
                        placeholder="Company name (optional)"
                    >
                </div>


                <div class="form-group">
                    <label>Required Work Location *</label>

                    <input
                        type="text"
                        id="requiredLocation"
                        placeholder="Where do you need the equipment?"
                        required
                    >
                </div>


                <div class="date-grid">

                    <div class="form-group">
                        <label>Start Date *</label>

                        <input
                            type="date"
                            id="startDate"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>End Date *</label>

                        <input
                            type="date"
                            id="endDate"
                            required
                        >
                    </div>

                </div>


                <div class="form-group">

                    <label>Additional Requirements</label>

                    <textarea
                        id="notes"
                        placeholder="Operator required, working hours, transport requirement, etc."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                    id="submitBtn"
                >
                    SUBMIT RENTAL REQUEST
                </button>

            </form>

        </div>

    </div>

</div>


<footer>
    © 2026 SHADAB CITY RENTAL — Equipment Rental Marketplace Saudi Arabia
</footer>


<script>

const API_URL = "http://localhost:3000";

let selectedEquipment = null;


/* ===============================
   GET EQUIPMENT ID FROM URL
================================ */

const params =
    new URLSearchParams(window.location.search);

const equipmentId =
    params.get("id");


/* ===============================
   ERROR MESSAGE
================================ */

function showError(message){

    const box =
        document.getElementById("errorMessage");

    box.textContent = message;
    box.style.display = "block";
}


function hideError(){

    document.getElementById("errorMessage")
        .style.display = "none";
}


/* ===============================
   HTML SECURITY
================================ */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ===============================
   LOAD EQUIPMENT
================================ */

async function loadEquipment(){

    const loading =
        document.getElementById("equipmentLoading");

    const details =
        document.getElementById("equipmentDetails");


    if(!equipmentId){

        loading.innerHTML =
            "Equipment not selected.";

        return;
    }


    try{

        const response =
            await fetch(`${API_URL}/api/equipment`);

        if(!response.ok){
            throw new Error("Unable to load equipment");
        }


        const equipmentList =
            await response.json();


        selectedEquipment =
            equipmentList.find(
                item =>
                    String(item.equipment_id) ===
                    String(equipmentId)
            );


        if(!selectedEquipment){

            loading.innerHTML =
                "This equipment is no longer available.";

            return;
        }


        /* Equipment image */

        const imageBox =
            document.getElementById("equipmentImage");


        if(selectedEquipment.image){

            imageBox.innerHTML = `
                <img
                    src="${selectedEquipment.image}"
                    alt="${escapeHTML(selectedEquipment.name)}"
                >
            `;

        }else{

            imageBox.innerHTML = `
                <div class="no-image">⚙</div>
            `;

        }


        /* Equipment information */

        document.getElementById("equipmentCategory")
            .textContent =
            selectedEquipment.category || "EQUIPMENT";


        document.getElementById("equipmentName")
            .textContent =
            selectedEquipment.name;


        document.getElementById("equipmentLocation")
            .textContent =
            selectedEquipment.location;


        document.getElementById("equipmentId")
            .textContent =
            selectedEquipment.equipment_id;


        document.getElementById("equipmentPrice")
            .textContent =
            Number(selectedEquipment.price || 0)
            .toLocaleString();


        loading.style.display = "none";
        details.style.display = "block";


    }catch(error){

        console.error(error);

        loading.innerHTML =
            "Unable to connect to rental database.";

    }

}


/* ===============================
   DATE VALIDATION
================================ */

const startDate =
    document.getElementById("startDate");

const endDate =
    document.getElementById("endDate");


const today =
    new Date().toISOString().split("T")[0];


startDate.min = today;
endDate.min = today;


startDate.addEventListener("change",function(){

    endDate.min = this.value;

    if(endDate.value && endDate.value < this.value){
        endDate.value = this.value;
    }

});


/* ===============================
   SUBMIT RENTAL REQUEST
================================ */

document
.getElementById("rentalForm")
.addEventListener("submit",async function(event){

    event.preventDefault();

    hideError();


    if(!selectedEquipment){

        showError("Equipment information is not available.");
        return;
    }


    const customerName =
        document.getElementById("customerName")
        .value.trim();


    const customerPhone =
        document.getElementById("customerPhone")
        .value.trim();


    const companyName =
        document.getElementById("companyName")
        .value.trim();


    const requiredLocation =
        document.getElementById("requiredLocation")
        .value.trim();


    const start =
        document.getElementById("startDate")
        .value;


    const end =
        document.getElementById("endDate")
        .value;


    const notes =
        document.getElementById("notes")
        .value.trim();


    if(!customerName ||
       !customerPhone ||
       !requiredLocation ||
       !start ||
       !end){

        showError("Please fill all required fields.");
        return;
    }


    if(end < start){

        showError("End date cannot be before start date.");
        return;
    }


    const submitBtn =
        document.getElementById("submitBtn");


    submitBtn.disabled = true;

    submitBtn.textContent =
        "SUBMITTING...";


    try{

        const response =
            await fetch(
                `${API_URL}/api/rental-requests`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        equipmentId:
                            selectedEquipment.equipment_id,

                        customerName:
                            customerName,

                        customerPhone:
                            customerPhone,

                        companyName:
                            companyName,

                        requiredLocation:
                            requiredLocation,

                        startDate:
                            start,

                        endDate:
                            end,

                        notes:
                            notes

                    })
                }
            );


        const result =
            await response.json();


        if(!response.ok){

            throw new Error(
                result.message ||
                "Rental request failed."
            );

        }


        /*
           Save only request ID.
           Actual request is stored in database.
        */

        sessionStorage.setItem(
            "lastRequestId",
            result.requestId
        );


        /*
           Open confirmation page
        */

        window.location.href =
            `request-confirmation.html?requestId=${
                encodeURIComponent(result.requestId)
            }`;


    }catch(error){

        console.error(error);

        showError(
            error.message ||
            "Unable to submit rental request."
        );


        submitBtn.disabled = false;

        submitBtn.textContent =
            "SUBMIT RENTAL REQUEST";

    }

});


/* ===============================
   START
================================ */

loadEquipment();

</script>

</body>
</html>
