<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Submitted | SHADAB CITY RENTAL</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #0b1f3a;
            color: white;
            padding: 18px 6%;
        }

        .header-inner {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            color: #f59e0b;
        }

        .home-btn {
            background: #f59e0b;
            color: #111827;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
        }

        .container {
            max-width: 850px;
            margin: 55px auto;
            padding: 0 20px;
        }

        .confirmation-card {
            background: white;
            border-radius: 14px;
            padding: 45px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .success-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
        }

        h1 {
            color: #0b1f3a;
            font-size: 32px;
            margin-bottom: 12px;
        }

        .intro {
            color: #667085;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .request-id {
            background: #f8fafc;
            border: 1px solid #e4e7ec;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .request-id small {
            display: block;
            color: #667085;
            margin-bottom: 6px;
        }

        .request-id strong {
            color: #0b1f3a;
            font-size: 22px;
        }

        .details {
            text-align: left;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 25px;
        }

        .detail {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
        }

        .detail strong {
            display: block;
            color: #667085;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .detail span {
            font-weight: 600;
            color: #172033;
        }

        .status {
            display: inline-block;
            background: #fff7d6;
            color: #946200;
            padding: 9px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .status.confirmed {
            background: #dcfce7;
            color: #166534;
        }

        .status.completed {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status.rejected {
            background: #fee2e2;
            color: #b91c1c;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 13px 22px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-primary {
            background: #f59e0b;
            color: #111827;
        }

        .btn-secondary {
            background: #0b1f3a;
            color: white;
        }

        .note {
            margin-top: 25px;
            color: #667085;
            font-size: 13px;
            line-height: 1.6;
        }

        .loading {
            background: white;
            padding: 45px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .loading h2 {
            color: #0b1f3a;
            margin-bottom: 10px;
        }

        .loading p {
            color: #667085;
        }

        .loader {
            width: 42px;
            height: 42px;
            border: 4px solid #e5e7eb;
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .not-found {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .not-found h2 {
            color: #0b1f3a;
            margin-bottom: 10px;
        }

        .not-found p {
            color: #667085;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .error-box {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0 20px;
            font-size: 14px;
        }

        @media (max-width: 650px) {

            .confirmation-card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 25px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .header-inner {
                gap: 10px;
            }

            .logo {
                font-size: 17px;
            }

            .home-btn {
                padding: 8px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">

        <a href="../index.html" class="logo">
            SHADAB <span>CITY RENTAL</span>
        </a>

        <a href="../index.html" class="home-btn">
            Home
        </a>

    </div>
</header>


<div class="container">

    <div id="content">

        <div class="loading">

            <div class="loader"></div>

            <h2>
                Loading Your Request...
            </h2>

            <p>
                Please wait while we retrieve your rental request.
            </p>

        </div>

    </div>

</div>


<script>

const API_BASE_URL = "http://localhost:3000/api";


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function formatDate(date) {

    if (!date) {
        return "-";
    }

    const d = new Date(date);

    if (isNaN(d.getTime())) {
        return date;
    }

    return d.toLocaleDateString("en-GB");

}


function getStatusClass(status) {

    const value = String(status || "")
        .toLowerCase();

    if (value === "confirmed") {
        return "confirmed";
    }

    if (value === "completed") {
        return "completed";
    }

    if (value === "rejected") {
        return "rejected";
    }

    return "";

}


function showNotFound(message) {

    const content =
        document.getElementById("content");

    content.innerHTML = `

        <div class="not-found">

            <h2>
                Request Not Found
            </h2>

            <p>
                ${escapeHTML(
                    message ||
                    "We could not find your rental request."
                )}
            </p>

            <div class="buttons">

                <a
                    href="customer-requests.html"
                    class="btn btn-primary"
                >
                    Track My Request
                </a>

                <a
                    href="equipment.html"
                    class="btn btn-secondary"
                >
                    Find Equipment
                </a>

            </div>

        </div>

    `;

}


function showError(message) {

    const content =
        document.getElementById("content");

    content.innerHTML = `

        <div class="not-found">

            <h2>
                Unable to Load Request
            </h2>

            <div class="error-box">
                ${escapeHTML(message)}
            </div>

            <p>
                Please make sure the SHADAB CITY RENTAL
                server is running and try again.
            </p>

            <div class="buttons">

                <a
                    href="customer-requests.html"
                    class="btn btn-primary"
                >
                    Track My Request
                </a>

                <a
                    href="../index.html"
                    class="btn btn-secondary"
                >
                    Home
                </a>

            </div>

        </div>

    `;

}


async function loadRequest() {

    const content =
        document.getElementById("content");


    const params =
        new URLSearchParams(
            window.location.search
        );


    let requestId =
        params.get("requestId");


    /*
        Backup:
        If requestId is not present in URL,
        check sessionStorage.
    */

    if (!requestId) {

        requestId =
            sessionStorage.getItem(
                "lastRequestId"
            );

    }


    if (!requestId) {

        showNotFound(
            "No Request ID was provided. Please submit a rental request first."
        );

        return;
    }


    requestId =
        requestId.trim();


    /*
        Save latest request ID
        for the Track My Request page.
    */

    sessionStorage.setItem(
        "lastRequestId",
        requestId
    );


    try {

        const response =
            await fetch(
                API_BASE_URL +
                "/rental-requests/track?requestId=" +
                encodeURIComponent(requestId)
            );


        const data =
            await response.json();


        if (!response.ok) {

            showNotFound(
                data.message ||
                "We could not find this rental request."
            );

            return;
        }


        const request =
            data.request || data;


        if (!request) {

            showNotFound(
                "We could not find this rental request."
            );

            return;
        }


        renderRequest(request);


    } catch (error) {

        console.error(
            "Request confirmation error:",
            error
        );


        showError(
            "Could not connect to the SHADAB CITY RENTAL server."
        );

    }

}


function renderRequest(request) {

    const content =
        document.getElementById("content");


    const status =
        request.status || "Pending";


    const statusClass =
        getStatusClass(status);


    /*
        Backend currently stores equipment_id
        in rental_requests.

        We display that value safely.
    */

    const equipmentName =
        request.equipment ||
        request.equipment_name ||
        request.equipmentId ||
        request.equipment_id ||
        "-";


    const category =
        request.category ||
        "-";


    const price =
        request.price ??
        "-";


    const equipmentLocation =
        request.listedLocation ||
        request.location ||
        "-";


    const requiredLocation =
        request.requiredLocation ||
        request.required_location ||
        "-";


    const customerName =
        request.customerName ||
        request.customer_name ||
        "-";


    const companyName =
        request.companyName ||
        request.company_name ||
        "-";


    const customerPhone =
        request.customerPhone ||
        request.customer_phone ||
        "-";


    const startDate =
        request.startDate ||
        request.start_date ||
        "";


    const endDate =
        request.endDate ||
        request.end_date ||
        "";


    content.innerHTML = `

        <div class="confirmation-card">

            <div class="success-icon">
                ✓
            </div>


            <h1>
                Rental Request Submitted!
            </h1>


            <p class="intro">

                Your rental request has been successfully received.
                Our team will review your request and connect you
                with the equipment owner.

            </p>


            <div class="request-id">

                <small>
                    Your Request ID
                </small>

                <strong>
                    #${escapeHTML(
                        request.request_id ||
                        request.requestId ||
                        request.id ||
                        "-"
                    )}
                </strong>

            </div>


            <div class="status ${statusClass}">

                STATUS:
                ${escapeHTML(status).toUpperCase()}

            </div>


            <div class="details">


                <div class="detail">

                    <strong>
                        Equipment
                    </strong>

                    <span>
                        ${escapeHTML(equipmentName)}
                    </span>

                </div>


                <div class="detail">

                    <strong>
                        Category
                    </strong>

                    <span>
                        ${escapeHTML(category)}
                    </span>

                </div>


                <div class="detail">

                    <strong>
                        Rental Price
                    </strong>

                    <span>
                        SAR ${escapeHTML(price)} / day
                    </span>

                </div>


                <div class="detail">

                    <strong>
                        Equipment Location
                    </strong>

                    <span>
                        ${escapeHTML(equipmentLocation)}
                    </span>

                </div>


                <div class="detail">

                    <strong>
                        Required Location
                    </strong>

                    <span>
                        ${escapeHTML(requiredLocation)}
                    </span>

                </div>


                <div class="detail">

                    <strong>
                        Rental Start
                    </strong>

                    <span>
                        ${formatDate(startDate)}
                    </span>

                </div>


                <div class="detail">

                    <strong>
                        Rental End
                    </strong>

                    <span>
                        ${formatDate(endDate)}
                    </span>

                </div>


                <div class="detail">

                    <strong>
                        Customer
                    </strong>

                    <span>
                        ${escapeHTML(customerName)}
                    </span>

                </div>


                ${
                    companyName !== "-"
                    ? `
                        <div class="detail">

                            <strong>
                                Company
                            </strong>

                            <span>
                                ${escapeHTML(companyName)}
                            </span>

                        </div>
                    `
                    : ""
                }


                <div class="detail">

                    <strong>
                        Mobile / WhatsApp
                    </strong>

                    <span>
                        ${escapeHTML(customerPhone)}
                    </span>

                </div>


            </div>


            <div class="buttons">

                <a
                    href="customer-requests.html"
                    class="btn btn-primary"
                >
                    Track My Request
                </a>


                <a
                    href="equipment.html"
                    class="btn btn-secondary"
                >
                    Find More Equipment
                </a>

            </div>


            <p class="note">

                Please keep your Request ID for reference.
                You can use your Request ID or Mobile / WhatsApp
                Number on the "My Requests" page to check your
                request status.

            </p>

        </div>

    `;

}


document.addEventListener(
    "DOMContentLoaded",
    loadRequest
);

</script>

</body>

</html>
